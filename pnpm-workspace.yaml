allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

# Preserve these exact versions already present in the original npm lockfile.
minimumReleaseAgeExclude:
  - caniuse-lite@1.0.30001827
  - tinybench@6.2.5

# Restore npm's compatible runtime links while keeping the parser binding's
# separate exact alpha dependencies. These packages already exist in the lock.
packageExtensions:
  '@napi-rs/wasm-runtime@1.2.7':
    dependencies:
      '@emnapi/core': 2.0.0-beta.2
      '@emnapi/runtime': 2.0.0-beta.2

# Replace peer edges with the explicit compatible runtime dependencies above;
# otherwise pnpm inherits the parser binding's incompatible alpha peers.
overrides:
  '@napi-rs/wasm-runtime@1.2.7>@emnapi/core:peer': '-'
  '@napi-rs/wasm-runtime@1.2.7>@emnapi/runtime:peer': '-'
